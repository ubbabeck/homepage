<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Category - Ruben Beck</title>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="images/favicon-32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="images/favicon-16.png"
    />
    <link rel="apple-touch-icon" href="images/profile.png" />
    <link rel="stylesheet" href="output.css" />
  </head>
  <body class="font-mono bg-white text-black">
    <div class="max-w-3xl mx-auto px-5 py-10">
      <header class="mb-10 pb-5 border-b border-black">
        <div class="flex gap-5 items-center">
          <img
            src="images/profile.png"
            alt="Ruben Beck"
            class="w-20 h-20 border border-black object-cover flex-shrink-0 transition-all duration-300 hover:shadow-md"
          />
          <div class="flex-1">
            <h1 class="text-4xl font-bold uppercase tracking-widest mb-2">
              <a href="index.html" class="hover:text-gray-600 transition-colors"
                >Ruben Beck</a
              >
            </h1>
            <p class="text-lg text-gray-700">
              Bitcoin Developer & Protocol Engineer
            </p>
          </div>
        </div>
      </header>

      <nav aria-label="Main navigation" class="mb-10">
        <ul class="flex gap-8 flex-wrap">
          <li>
            <a
              href="index.html#about"
              class="hover:text-gray-600 transition-colors"
              >About</a
            >
          </li>
          <li>
            <a
              href="index.html#writings"
              class="hover:text-gray-600 transition-colors"
              >Writings</a
            >
          </li>
          <li>
            <a
              href="index.html#categories"
              class="hover:text-gray-600 transition-colors"
              >Categories</a
            >
          </li>
          <li>
            <a
              href="index.html#contact"
              class="hover:text-gray-600 transition-colors"
              >Contact</a
            >
          </li>
          <li>
            <a
              href="https://github.com/ubbabeck"
              target="_blank"
              rel="noopener noreferrer"
              class="hover:text-gray-600 transition-colors"
              >Projects</a
            >
          </li>
        </ul>
      </nav>

      <main class="space-y-10">
        <section class="mb-10 pb-6 border-b border-gray-300">
          <h2
            id="category-title"
            class="text-2xl font-bold mb-6 uppercase tracking-wide"
          >
            Category
          </h2>
          <div class="space-y-4" id="category-posts">
            <!-- Posts will be loaded dynamically -->
          </div>
        </section>
      </main>

      <footer
        class="mt-10 pt-8 border-t border-gray-300 text-sm text-gray-700 space-y-4"
      >
        <p>
          Help people in countries that censor the internet access Tor. Leave
          this page open with Snowflake turned on:<br />
        </p>
        <iframe
          src="https://snowflake.torproject.org/embed.html"
          width="320px"
          height="250px"
          frameborder="0"
          scrolling="no"
        ></iframe>
        <p>&copy; 2025 Ruben Beck. Decentralized. Trustless. Permissionless.</p>
      </footer>
    </div>

    <script src="js/category.js" type="module"></script>
  </body>
</html>
